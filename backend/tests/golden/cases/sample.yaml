# golden 种子用例（T0.4：3 条跑通；格式 = SSOT §18.3；滚动门槛 P1≥15/P2≥30/P3≥40/T4.1=50）
- id: mom_by_channel
  dialect: doris
  question: 上个月各渠道的订单量和销售额环比？
  sql: |
    WITH cur AS (
      SELECT channel_id, COUNT(*) AS cnt, SUM(amount) AS amt
      FROM orders
      WHERE is_test = 0 AND created_at >= '2026-09-01' AND created_at < '2026-10-01'
      GROUP BY channel_id
    ), prev AS (
      SELECT channel_id, COUNT(*) AS cnt, SUM(amount) AS amt
      FROM orders
      WHERE is_test = 0 AND created_at >= '2026-08-01' AND created_at < '2026-09-01'
      GROUP BY channel_id
    )
    SELECT c.channel_id, c.cnt, c.amt,
           LAG(p.cnt) OVER (ORDER BY c.channel_id) AS prev_cnt
    FROM cur c JOIN prev p ON c.channel_id = p.channel_id
  expect_ast: {has_cte: true, has_window: "LAG", tables: [orders], where_has: ["is_test = 0"]}
- id: clarify_income
  question: 本月收入是多少？
